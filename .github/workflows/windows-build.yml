name: Windows Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build solution
        run: dotnet build GeniaFolder.slnx -c Release
      - name: Security smoke tests
        run: dotnet run --project tests/GeniaFolder.SecuritySmokeTests/GeniaFolder.SecuritySmokeTests.csproj -c Release --no-build
